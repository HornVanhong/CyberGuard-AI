services:
  clamav:
    image: clamav/clamav:latest
    container_name: cyberguard-clamav
    restart: unless-stopped
    environment:
      - CLAMD_CONF_MaxFileSize=25M
      - CLAMD_CONF_StreamMaxLength=30M
    ports:
      - "3310:3310"
    volumes:
      - clamav_signatures:/var/lib/clamav
    networks:
      - cyberguard-net
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1500M

  cyberguard-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberguard-bot
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - DATABASE_PATH=/app/data/cyberguard.db
      - TEMP_DIR=/app/temp_uploads
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,size=300m
      - /app/temp_uploads:rw,noexec,nosuid,size=200m,uid=10001,gid=10001,mode=0775
    volumes:
      - cyberguard_data:/app/data
    networks:
      - cyberguard-net
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2500M

  kali-analyzer:
    build:
      context: .
      dockerfile: docker/kali-analyzer/Dockerfile
      args:
        INSTALL_GHIDRA: "true"
    image: cyberguard-kali-analyzer:latest
    container_name: cyberguard-kali-analyzer
    restart: unless-stopped
    user: "10002:10002"
    environment:
      - TMPDIR=/tmp
      - HOME=/home/analyzer
    privileged: false
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,size=300m
      - /tmp/analysis:rw,noexec,nosuid,size=500m,uid=10002,gid=10002,mode=0770
      - /home/analyzer:rw,nosuid,size=100m,uid=10002,gid=10002,mode=0770
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3000M
          pids: 150
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - ./docker/kali-analyzer/samples:/samples:ro
      - ./docker/kali-analyzer/reports:/reports:rw
      - ./docker/kali-analyzer/logs:/logs:rw
      - ./rules:/opt/rules/yara:ro
    networks:
      - cyberguard-net

networks:
  cyberguard-net:
    driver: bridge
    internal: false

volumes:
  cyberguard_data:
  clamav_signatures:
