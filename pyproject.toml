[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberguard-ai"
version = "1.0.0"
description = "Production-grade Telegram Malware Scanner Bot with ClamAV, YARA, and Multi-Engine Static Analysis."
authors = [{ name = "CyberGuard AI Team" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-telegram-bot>=21.0,<23.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "google-genai>=1.0.0",
    "puremagic>=2.0.0",
    "yara-python>=4.5.0",
    "pypdf>=4.0.0",
    "oletools>=0.60.0",
    "pdfid>=1.1.0",
    "pyexiftool>=0.5.0",
    "pefile>=2024.8.0",
    "flare-capa>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
